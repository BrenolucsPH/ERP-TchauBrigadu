{% extends 'base.html' %}

{% block conteudo %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="text-light fw-bold"><i class="bi bi-cart-plus text-success me-2"></i>Nova Venda</h3>
        <a href="{% url 'painel_comercial' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Voltar</a>
    </div>

    <form action="{% url 'registrar_venda' %}" method="POST">
        {% csrf_token %}
        <div class="row">
            <!-- Coluna da Esquerda: Dados do Cliente -->
            <div class="col-md-4 mb-4">
                <div class="card border-secondary bg-dark shadow-sm h-100">
                    <div class="card-header border-secondary text-success fw-bold">1. Dados da Venda</div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label text-muted">Cliente / Loja *</label>
                            <select name="cliente" class="form-select bg-dark text-light border-secondary" required>
                                <option value="">Selecione o Cliente...</option>
                                {% for cliente in clientes %}
                                <option value="{{ cliente.id }}">{{ cliente.nome }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted">Observações da Venda</label>
                            <textarea name="observacao" class="form-control bg-dark text-light border-secondary" rows="4" placeholder="Condições de pagamento, detalhes de entrega..."></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Coluna da Direita: Carrinho de Produtos -->
            <div class="col-md-8 mb-4">
                <div class="card border-secondary bg-dark shadow-sm h-100">
                    <div class="card-header border-secondary text-info fw-bold d-flex justify-content-between align-items-center">
                        <span>2. Produtos da Venda</span>
                        <button type="button" class="btn btn-sm btn-outline-info" id="btn-add-item"><i class="bi bi-plus-lg"></i> Adicionar Linha</button>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-dark table-borderless align-middle mb-0" id="tabela-itens">
                            <thead class="border-bottom border-secondary text-muted">
                                <tr>
                                    <th>Produto Final</th>
                                    <th style="width: 120px;">Qtd.</th>
                                    <th style="width: 150px;">Preço Unit. (R$)</th>
                                    <th style="width: 50px;"></th>
                                </tr>
                            </thead>
                            <tbody id="lista-itens">
                                <!-- Linha Padrão (Oculta, usada para clonar) -->
                                <tr class="item-linha">
                                    <td>
                                        <select name="produto[]" class="form-select form-select-sm bg-dark text-light border-secondary" required>
                                            <option value="">Selecione...</option>
                                            {% for produto in produtos %}
                                            <option value="{{ produto.id }}">{{ produto.nome }}</option>
                                            {% endfor %}
                                        </select>
                                    </td>
                                    <td>
                                        <input type="number" name="quantidade[]" class="form-control form-control-sm bg-dark text-light border-secondary" min="1" value="1" required>
                                    </td>
                                    <td>
                                        <input type="number" step="0.01" name="preco[]" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="0.00" required>
                                    </td>
                                    <td>
                                        <button type="button" class="btn btn-sm btn-outline-danger btn-remover"><i class="bi bi-trash"></i></button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="card-footer border-secondary text-end p-3">
                        <button type="submit" class="btn btn-success btn-lg fw-bold px-5"><i class="bi bi-check-circle"></i> Finalizar Venda</button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<!-- Script para Adicionar e Remover Linhas da Tabela -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const btnAdd = document.getElementById('btn-add-item');
        const listaItens = document.getElementById('lista-itens');
        
        // Função para adicionar nova linha
        btnAdd.addEventListener('click', function() {
            // Pega a primeira linha e clona
            const primeiraLinha = listaItens.querySelector('.item-linha');
            const novaLinha = primeiraLinha.cloneNode(true);
            
            // Limpa os valores copiados
            novaLinha.querySelector('select').value = '';
            novaLinha.querySelector('input[name="quantidade[]"]').value = '1';
            novaLinha.querySelector('input[name="preco[]"]').value = '';
            
            // Adiciona a nova linha no final da tabela
            listaItens.appendChild(novaLinha);
            
            // Recalcula os botões de remover
            atualizarBotoesRemover();
        });

        // Função para atualizar os botões de remover
        function atualizarBotoesRemover() {
            const botoesRemover = document.querySelectorAll('.btn-remover');
            botoesRemover.forEach(function(btn) {
                // Remove eventos antigos para não duplicar
                const novoBtn = btn.cloneNode(true);
                btn.parentNode.replaceChild(novoBtn, btn);
                
                novoBtn.addEventListener('click', function() {
                    const linhas = document.querySelectorAll('.item-linha');
                    // Só deixa remover se tiver mais de uma linha
                    if (linhas.length > 1) {
                        this.closest('tr').remove();
                    } else {
                        alert('A venda precisa ter pelo menos um item!');
                    }
                });
            });
        }
        
        // Inicia ativando o botão de remover da primeira linha
        atualizarBotoesRemover();
    });
</script>
{% endblock %}
