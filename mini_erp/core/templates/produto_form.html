{% extends 'base.html' %}

{% block conteudo %}
<style>
    /* Truque mágico para deixar os inputs do Django perfeitamente escuros */
    .form-dark input, .form-dark select, .form-dark textarea {
        background-color: #1e1f20 !important;
        color: #e3e3e3 !important;
        border: 1px solid #44474a !important;
        border-radius: 8px;
        padding: 10px 15px;
        width: 100%;
        margin-bottom: 1rem;
        transition: border-color 0.2s;
    }
    .form-dark input:focus, .form-dark select:focus {
        border-color: #0d6efd !important;
        outline: none;
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
    }
    .form-dark label {
        font-weight: 500;
        margin-bottom: 6px;
        color: #c4c7c5;
        font-size: 0.9rem;
    }
    .helptext { font-size: 0.8rem; color: #6c757d; display: block; margin-top: -10px; margin-bottom: 15px; }
</style>

<div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom border-secondary">
    <h3 class="fw-bold mb-0">
        <i class="bi bi-box-seam text-success me-2"></i> 
        <!-- O Django sabe se está editando ou criando pelo "object" -->
        {% if object %}Editar Item{% else %}Cadastrar Novo Item{% endif %}
    </h3>
    <a href="{% url 'painel' %}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Voltar ao Painel</a>
</div>

<div class="card border-secondary bg-dark shadow-sm form-dark" style="max-width: 600px; margin: 0 auto;">
    <div class="card-body p-4 p-md-5">
        <form method="POST">
            {% csrf_token %}
            
            {{ form.as_p }}
            
            <div class="d-grid gap-2 mt-4 pt-2 border-top border-secondary">
                <button type="submit" class="btn btn-success btn-lg fs-6">
                    <i class="bi bi-check2-circle me-1"></i> Salvar Informações
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
