<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - ERP Fumo & Cia</title>
</head>
<body style="font-family: Arial, sans-serif; display: flex; justify-content: center; margin-top: 100px;">

    <div style="border: 1px solid #ccc; padding: 30px; border-radius: 8px; box-shadow: 2px 2px 10px rgba(0,0,0,0.1);">
        <h2>Acesso ao Sistema</h2>
        <hr>
        
        <form method="post">
            {% csrf_token %} <p>
                <label>Usuário:</label><br>
                <input type="text" name="username" required>
            </p>
            <p>
                <label>Senha:</label><br>
                <input type="password" name="password" required>
            </p>
            
            <button type="submit" style="padding: 10px 20px; background-color: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer;">
                Entrar no ERP
            </button>
        </form>

        {% if form.errors %}
            <p style="color: red; margin-top: 15px;">Usuário ou senha incorretos. Tente novamente.</p>
        {% endif %}
    </div>

</body>
</html>
